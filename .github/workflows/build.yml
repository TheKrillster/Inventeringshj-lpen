name: Bygg APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Packa upp zip
        run: |
          shopt -s nullglob
          for z in *.zip; do
            echo "Packar upp $z"
            unzip -o -q "$z" -d _unzip
          done

      - name: Hitta projektet
        id: proj
        run: |
          f=$(find . -name settings.gradle.kts -not -path "*/build/*" | awk '{ print length, $0 }' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$f" ]; then echo "Hittar inget projekt"; ls -la; exit 1; fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Bygg
        run: gradle -p "${{ steps.proj.outputs.dir }}" assembleDebug --no-daemon --stacktrace

      - name: Döp APK
        run: |
          apk=$(find . -path "*/build/outputs/apk/debug/*.apk" | head -1)
          cp "$apk" Inventeringshjalpen.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Inventeringshjälpen 1.0.${{ github.run_number }}
          files: Inventeringshjalpen.apk
          make_latest: true
